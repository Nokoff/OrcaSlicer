    // My Files is rendered over the home content area so the Flutter sidebar

    window.showMyFilesOverlay = function () {
      let frame = document.getElementById('my-files-frame');
      if (!frame) {
        frame = document.createElement('iframe');
        frame.id = 'my-files-frame';
        frame.title = 'My Files';

          left: '262px',

          height: '100%',
          border: '0',
          zIndex: '1000',
          background: '#fff'
        });
        document.body.appendChild(frame);
      }
      frame.style.display = 'block';
    };

    window.hideMyFilesOverlay = function () {
      const frame = document.getElementById('my-files-frame');
      if (frame) frame.style.display = 'none';
    };

    window.dispatchMyFilesMessage = function (message) {
      const frame = document.getElementById('my-files-frame');
